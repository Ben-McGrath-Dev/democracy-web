<!DOCTYPE html>
<html lang="en" data-ui-mode="simple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="A secure cloud-connected browser political simulation game">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <meta name="color-scheme" content="light">
  <title>Democracy Web</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand sidebar-brand" data-route="home" aria-label="Democracy Web home">
        <span class="brand-mark">D</span>
        <span><strong>Democracy Web</strong><small><span id="appVersion"></span> · <span id="saveStatus">Local</span></small></span>
      </button>

      <div class="sidebar-tools">
        <button class="sidebar-search" type="button" data-action="open-command-palette" aria-keyshortcuts="Control+K Meta+K">
          <span aria-hidden="true">⌕</span><span>Search or jump to…</span><kbd>⌘K</kbd>
        </button>
      </div>
      <nav class="side-nav" aria-label="Sections">
        <div class="nav-group" data-nav-group="overview">
          <button class="nav-group-toggle" type="button" data-action="toggle-nav-group" data-nav-group-name="overview" aria-expanded="true"><span>Overview</span><span class="nav-group-chevron" aria-hidden="true">⌄</span></button>
          <div class="nav-group-items">
            <button data-route="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
            <button data-route="actions"><span class="nav-icon">!</span><span>My Actions</span><span id="actionBadge" class="nav-badge nav-badge-action" hidden>0</span></button>
            <button data-route="activity"><span class="nav-icon">◷</span><span>Activity</span></button>
            <button data-route="multiplayer"><span class="nav-icon">◎</span><span>Multiplayer</span></button>
            <button data-route="notifications"><span class="nav-icon">◔</span><span>Notifications</span><span id="notificationBadge" class="nav-badge" hidden>0</span></button>
            <button data-route="help"><span class="nav-icon">?</span><span>Help & Guides</span></button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="politics">
          <button class="nav-group-toggle" type="button" data-action="toggle-nav-group" data-nav-group-name="politics" aria-expanded="true"><span>Politics</span><span class="nav-group-chevron" aria-hidden="true">⌄</span></button>
          <div class="nav-group-items">
            <button data-route="votes"><span class="nav-icon">✓</span><span>Votes</span><span id="voteBadge" class="nav-badge nav-badge-action" hidden>0</span></button>
            <button data-route="elections"><span class="nav-icon">◫</span><span>Elections</span></button>
            <button data-route="parliament"><span class="nav-icon">▥</span><span>Parliament</span></button>
            <button data-route="government"><span class="nav-icon">◆</span><span>Government</span></button>
            <button data-route="parties"><span class="nav-icon">●</span><span>Parties</span></button>
            <button data-route="players"><span class="nav-icon">◉</span><span>Players</span></button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="law">
          <button class="nav-group-toggle" type="button" data-action="toggle-nav-group" data-nav-group-name="law" aria-expanded="true"><span>Law & Constitution</span><span class="nav-group-chevron" aria-hidden="true">⌄</span></button>
          <div class="nav-group-items">
            <button data-route="laws"><span class="nav-icon">§</span><span>Laws</span></button>
            <button data-route="constitution"><span class="nav-icon">¶</span><span>Constitution</span></button>
            <button data-route="committees"><span class="nav-icon">◇</span><span>Committees</span></button>
            <button data-route="cases"><span class="nav-icon">⚖</span><span>Cases</span><span id="caseBadge" class="nav-badge nav-badge-action" hidden>0</span></button>
            <button data-route="rulebook"><span class="nav-icon">▤</span><span>Full Rulebook</span></button>
          </div>
        </div>
        <div class="nav-group" data-nav-group="system">
          <button class="nav-group-toggle" type="button" data-action="toggle-nav-group" data-nav-group-name="system" aria-expanded="true"><span>System</span><span class="nav-group-chevron" aria-hidden="true">⌄</span></button>
          <div class="nav-group-items">
            <button class="advanced-only" data-route="recovery"><span class="nav-icon">↻</span><span>Recovery</span></button>
            <button data-route="load"><span class="nav-icon">▣</span><span>Saves</span></button>
            <button class="advanced-only" data-route="testlab"><span class="nav-icon">⌁</span><span>Test Lab</span></button>
            <button class="advanced-only" data-route="release"><span class="nav-icon">★</span><span>Release</span></button>
            <button class="advanced-only" data-route="about"><span class="nav-icon">i</span><span>About</span></button>
          </div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebarContext" class="sidebar-context" aria-live="polite">
          <div class="sidebar-context-row"><span id="shellConnectionDot" class="connection-dot local" aria-hidden="true"></span><strong id="shellConnectionLabel">Local game</strong></div>
          <div id="shellActorRow" class="sidebar-actor" hidden><span class="avatar avatar-sm" id="shellActorAvatar">?</span><span><small>Acting as</small><strong id="shellActorName">—</strong></span></div>
        </div>
        <button class="btn btn-block" data-action="toggle-ui-mode">◐ <span data-ui-mode-label>Simple</span> interface</button>
        <button class="btn btn-primary btn-block" data-route="create">＋ New Democracy</button>
      </div>
    </aside>

    <header class="mobile-header">
      <div class="mobile-header-leading">
        <button id="mobileBackButton" class="icon-btn mobile-back" data-action="mobile-back" aria-label="Back" hidden>←</button>
        <button class="mobile-page-identity" data-route="dashboard" aria-label="Open Dashboard">
          <span id="mobilePageKicker">Democracy Web</span>
          <strong id="mobilePageTitle">Home</strong>
        </button>
      </div>
      <div class="mobile-header-actions"><button class="icon-btn" data-action="open-command-palette" aria-label="Search and jump to">⌕</button><button class="icon-btn" data-action="toggle-mobile-menu" aria-label="Open navigation" aria-expanded="false">☰</button></div>
    </header>

    <div id="securityBanner" class="security-banner" hidden></div>
    <main id="view" class="page-shell" tabindex="-1"></main>

    <nav class="mobile-dock" aria-label="Quick navigation">
      <button data-route="dashboard"><span>⌂</span><small>Home</small></button>
      <button data-route="actions"><span class="dock-icon-wrap">!<b id="dockActionBadge" class="dock-badge" hidden>0</b></span><small>My Actions</small></button>
      <button data-route="votes"><span class="dock-icon-wrap">✓<b id="dockVoteBadge" class="dock-badge" hidden>0</b></span><small>Votes</small></button>
      <button data-route="cases"><span class="dock-icon-wrap">⚖<b id="dockCaseBadge" class="dock-badge" hidden>0</b></span><small>Cases</small></button>
      <button data-action="toggle-mobile-menu"><span>☰</span><small>Menu</small></button>
    </nav>

    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
      <button class="mobile-menu-backdrop" data-action="toggle-mobile-menu" aria-label="Close navigation"></button>
      <section class="mobile-menu-sheet" aria-label="All navigation">
        <div class="mobile-menu-handle"></div>
        <div class="mobile-menu-top">
          <div><span class="page-kicker">Democracy Web</span><h2>Menu</h2></div>
          <button class="icon-btn" data-action="toggle-mobile-menu" aria-label="Close">×</button>
        </div>
        <div class="mobile-context-card" aria-live="polite">
          <span id="mobileShellConnectionDot" class="connection-dot local" aria-hidden="true"></span>
          <div><small id="mobileShellConnectionLabel">Local game</small><strong id="mobileShellActorName">No player selected</strong></div>
          <span id="mobileSaveStatus" class="mobile-save-chip">Saved</span>
        </div>
        <button class="mobile-search" type="button" data-action="open-command-palette">⌕ <span>Search pages, people and political objects</span><kbd>⌘K</kbd></button>
        <div class="mobile-menu-sections">
          <section class="mobile-menu-section"><h3>Overview</h3><div class="mobile-menu-grid">
            <button data-route="dashboard">⌂ <span>Dashboard</span></button><button data-route="actions">! <span>My Actions</span><span id="mobileActionBadge" class="nav-badge nav-badge-action" hidden>0</span></button>
            <button data-route="activity">◷ <span>Activity</span></button><button data-route="notifications">◔ <span>Notifications</span></button>
            <button data-route="multiplayer">◎ <span>Multiplayer</span></button><button data-route="help">? <span>Help & Guides</span></button>
          </div></section>
          <section class="mobile-menu-section"><h3>Politics</h3><div class="mobile-menu-grid">
            <button data-route="votes">✓ <span>Votes</span><span id="mobileVoteBadge" class="nav-badge nav-badge-action" hidden>0</span></button><button data-route="elections">◫ <span>Elections</span></button>
            <button data-route="parliament">▥ <span>Parliament</span></button><button data-route="government">◆ <span>Government</span></button>
            <button data-route="parties">● <span>Parties</span></button><button data-route="players">◉ <span>Players</span></button>
          </div></section>
          <section class="mobile-menu-section"><h3>Law & Constitution</h3><div class="mobile-menu-grid">
            <button data-route="laws">§ <span>Laws</span></button><button data-route="constitution">¶ <span>Constitution</span></button>
            <button data-route="committees">◇ <span>Committees</span></button><button data-route="cases">⚖ <span>Cases</span><span id="mobileCaseBadge" class="nav-badge nav-badge-action" hidden>0</span></button>
            <button data-route="rulebook">▤ <span>Full Rulebook</span></button><button data-route="load">▣ <span>Saves</span></button>
          </div></section>
          <section class="mobile-menu-section advanced-only"><h3>Advanced</h3><div class="mobile-menu-grid">
            <button data-route="recovery">↻ <span>Recovery</span></button><button data-route="testlab">⌁ <span>Test Lab</span></button>
            <button data-route="release">★ <span>Release</span></button><button data-route="about">i <span>About</span></button>
          </div></section>
        </div>
        <div class="mobile-menu-footer"><button class="btn btn-block" data-action="toggle-ui-mode">◐ <span data-ui-mode-label>Simple</span> interface</button><button class="btn btn-primary btn-block" data-route="create">＋ Create Democracy</button></div>
      </section>
    </div>


    <div id="commandPalette" class="command-palette" hidden aria-hidden="true">
      <button class="command-palette-backdrop" type="button" data-action="close-command-palette" aria-label="Close search"></button>
      <section class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="commandPaletteTitle">
        <h2 id="commandPaletteTitle" class="sr-only">Search and jump to</h2>
        <div class="command-search-row"><span aria-hidden="true">⌕</span><input id="commandSearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search pages, players, parties, laws, cases…" aria-controls="commandResults"><kbd>Esc</kbd></div>
        <div id="commandResults" class="command-results" role="listbox" aria-label="Search results"></div>
        <div class="command-footer"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
      </section>
    </div>
    <div id="connectionAnnouncer" class="sr-only" aria-live="polite"></div>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modalRoot"></div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
